name: datagov
# סדרה חודשית רשמית לכל מסלול (data.gov.il) - scripts/b6_fetch_datagov.py
on:
  schedule:
    - cron: "41 4 25 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datagov
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests
      - run: python -u scripts/b6_fetch_datagov.py --from 202201
      - name: Backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datagov-${{ github.run_id }}
          path: data/datagov
          retention-days: 14
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # בלי rebase על קבצי נתונים: מעתיקים את התיקייה החדשה, מתיישרים לראש הענף, מחזירים ושומרים
          rm -rf /tmp/newdata && cp -r data/datagov /tmp/newdata
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            rm -rf data/datagov && mkdir -p "$(dirname data/datagov)" && cp -r /tmp/newdata data/datagov
            git add -A data/datagov
            git diff --staged --quiet && exit 0
            git commit -q -m "auto: datagov monthly [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
