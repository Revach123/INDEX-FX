name: market-data
# משיכה יומית של שערי מדדים (yfinance) ושער/ריבית בנק ישראל. טרם הורץ ב-Actions (נבדק מקומית בלבד).
on:
  workflow_dispatch:
  schedule:
    - cron: "40 20 * * 1-5"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests yfinance
      - run: python scripts/b1_fetch_market.py --start 2022-01-01
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market
          git diff --staged --quiet && exit 0
          git commit -m "auto: market data"
          git push
