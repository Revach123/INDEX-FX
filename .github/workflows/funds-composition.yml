name: funds-composition
# הרכב נכסים מלא לכל קרן נאמנות/סל מהדוח החודשי ב-Maya (scripts/b4_fetch_funds_composition.py).
# חודשי (הדוחות מוגשים עד ~15 בחודש), ידני עם חלון לבחירה, ובדיקה בדחיפה לענף הפיתוח.
on:
  schedule:
    - cron: "17 3 20 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "חלון דוחות לאחור (חודשים)"
        required: true
        default: "2"
      max_reports:
        description: "הגבלה לבדיקה (0 = הכל)"
        required: true
        default: "0"
permissions:
  contents: write
concurrency:
  group: funds-composition
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests
      - name: Fetch
        run: |
          MONTHS="${{ inputs.months || '2' }}"
          MAX="${{ inputs.max_reports || '0' }}"
          python -u scripts/b4_fetch_funds_composition.py --months "$MONTHS" --max-reports "$MAX"
      - name: Backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funds_composition-${{ github.run_id }}
          path: data/funds_composition
          retention-days: 14
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # בלי rebase על קבצי נתונים: מעתיקים את התיקייה החדשה, מתיישרים לראש הענף, מחזירים ושומרים
          rm -rf /tmp/newdata && cp -r data/funds_composition /tmp/newdata
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            rm -rf data/funds_composition && mkdir -p "$(dirname data/funds_composition)" && cp -r /tmp/newdata data/funds_composition
            git add -A data/funds_composition
            git diff --staged --quiet && exit 0
            git commit -q -m "auto: funds composition [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
